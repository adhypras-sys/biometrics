<html lang="id">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioMetrics Pro</title>

<!-- Prevent flash of wrong theme -->
<script>
(function(){
  try{
    var d=localStorage.getItem('bm-dark');
    var s=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
    if(d==='true'||(d===null&&s))document.documentElement.classList.add('dark');
  }catch(e){}
})();
</script>

/* ═══════════════════════════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════════════════════════ */
:root {
  /* spacing */
  --s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;
  --s5:1.25rem;--s6:1.5rem;--s8:2rem;

  /* radius */
  --r-s:.375rem;--r-m:.625rem;--r-l:.875rem;--r-xl:1.125rem;--r-2xl:1.625rem;

  /* easing */
  --spring:cubic-bezier(.34,1.56,.64,1);
  --out:cubic-bezier(0,0,.2,1);
  --smooth:cubic-bezier(.4,0,.2,1);
  --in-out:cubic-bezier(.4,0,.6,1);

  /* duration */
  --t1:80ms;--t2:160ms;--t3:280ms;--t4:420ms;

  /* ── Light surfaces ── */
  --pg:#f2f2f7;
  --s0:#ffffff;
  --s1a:#f9f9fc;
  --s2a:#f0f0f5;
  --hov:rgba(0,0,0,.04);

  --b0:rgba(0,0,0,.06);
  --b1:rgba(0,0,0,.10);
  --b2:rgba(0,0,0,.16);

  --tx1:#0f0f12;
  --tx2:#52525b;
  --tx3:#a1a1aa;
  --tx4:#d4d4d8;

  --sh0:0 1px 2px rgba(0,0,0,.04);
  --sh1:0 2px 8px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.04);
  --sh2:0 6px 20px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.05);
  --sh3:0 12px 36px rgba(0,0,0,.14),0 4px 12px rgba(0,0,0,.07);

  /* status */
  --good:#16a34a;--warn:#d97706;--danger:#dc2626;--info:#2563eb;
}

html.dark {
  --pg:#0a0a0d;
  --s0:#18181b;
  --s1a:#141417;
  --s2a:#111114;
  --hov:rgba(255,255,255,.05);

  --b0:rgba(255,255,255,.07);
  --b1:rgba(255,255,255,.11);
  --b2:rgba(255,255,255,.18);

  --tx1:#f4f4f6;
  --tx2:#a1a1aa;
  --tx3:#71717a;
  --tx4:#3f3f46;

/* ── base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-sans);
  background:var(--pg);color:var(--tx1);
  min-height:100vh;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background var(--t3) var(--smooth),color var(--t3) var(--smooth);

.c-good{color:var(--good);}.c-warn{color:var(--warn);}
.c-danger{color:var(--danger);}.c-info{color:var(--info);}
.c-brand{color:var(--color-brand-500);}
html.dark .c-brand{color:var(--color-brand-400);}

/* ═══════════════════════════════════════════════════════════════
   PAGE BACKGROUND — subtle mesh gradient that follows brand color
═══════════════════════════════════════════════════════════════ */
body::before{
  content:'';
  position:fixed;inset:0;z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(ellipse 70% 55% at 15% 0%,
      color-mix(in oklab,var(--color-brand-400) 9%,transparent) 0%,transparent 70%),
    radial-gradient(ellipse 55% 45% at 88% 100%,
      color-mix(in oklab,var(--color-brand-500) 7%,transparent) 0%,transparent 65%),

  pointer-events:none;
}

    radial-gradient(ellipse 55% 45% at 88% 100%,
      color-mix(in oklab,var(--color-brand-900) 15%,transparent) 0%,transparent 65%),
    var(--pg);
}

/* ═══════════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════════ */
.hdr{

  gap:var(--s4);flex-wrap:wrap;

.logo-area{display:flex;align-items:center;gap:var(--s3);flex:1;min-width:0;}

  width:2rem;height:2rem;border-radius:var(--r-m);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--color-brand-400),var(--color-brand-600));

  font-size:.9375rem;font-weight:800;letter-spacing:-.02em;

.swk{
  width:.9375rem;height:.9375rem;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);
  transition:transform var(--t2) var(--spring);flex-shrink:0;
}
.sw.on .swk{transform:translateX(1.125rem);}

/* Dark button */
.dbtn{
  width:1.875rem;height:1.875rem;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--tx3);cursor:pointer;flex-shrink:0;
  transition:background var(--t1),color var(--t1),transform var(--t1) var(--spring);
}
.dbtn:hover{background:var(--hov);color:var(--color-brand-500);transform:rotate(20deg) scale(1.1);}
html.dark .dbtn:hover{transform:rotate(-20deg) scale(1.1);}

/* ═══════════════════════════════════════════════════════════════
   PAGE LAYOUT
═══════════════════════════════════════════════════════════════ */
.page{
  max-width:72rem;margin:0 auto;
  padding:var(--s6) var(--s4) var(--s8);
}
@media(min-width:640px){.page{padding:var(--s8) var(--s6);}}
@media(min-width:1024px){.page{padding:var(--s8);}}

/* ═══════════════════════════════════════════════════════════════
   INPUT PANEL
═══════════════════════════════════════════════════════════════ */
.inp-panel{
  background:var(--s0);
  border:1px solid var(--b0);border-radius:var(--r-xl);
  overflow:hidden;margin-bottom:var(--s5);
  box-shadow:var(--sh1);
  transition:background var(--t3) var(--smooth),border-color var(--t3) var(--smooth),box-shadow var(--t2) var(--smooth);
}
html.dark .inp-panel{background:var(--s1a);border-color:var(--b1);box-shadow:var(--sh0);}
.inp-panel:focus-within{
  border-color:color-mix(in oklab,var(--color-brand-400) 45%,transparent);
  box-shadow:var(--sh1),0 0 0 4px color-mix(in oklab,var(--color-brand-400) 8%,transparent);
}

/* Section trigger */
.trig{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:var(--s4) var(--s5);gap:var(--s3);
  background:transparent;border:none;cursor:pointer;text-align:left;
  transition:background var(--t1);
}
.trig:hover{background:var(--hov);}
.trig:focus-visible{outline:2px solid var(--color-brand-500);outline-offset:-2px;}
.trig-lbl{
  display:flex;align-items:center;gap:var(--s2);
  font-size:.875rem;font-weight:700;letter-spacing:-.01em;
  color:var(--tx1);transition:color var(--t1);
}
.trig:hover .trig-lbl{color:var(--color-brand-500);}
html.dark .trig:hover .trig-lbl{color:var(--color-brand-400);}
.trig-bar{
  width:3px;height:.9375rem;border-radius:99px;flex-shrink:0;
  background:linear-gradient(180deg,var(--color-brand-400),var(--color-brand-600));
  transition:background var(--t2);
}
.chev{
  width:1.125rem;height:1.125rem;color:var(--tx3);flex-shrink:0;
  transition:transform var(--t2) var(--smooth),color var(--t1);
}
.chev.open{transform:rotate(180deg);}
.trig:hover .chev{color:var(--color-brand-500);}

/* Collapsible */
.coll{
  display:grid;grid-template-rows:1fr;
  transition:grid-template-rows var(--t2) var(--smooth);
  overflow:hidden;
}
.coll.shut{grid-template-rows:0fr;}
.coll>div{min-height:0;overflow:hidden;}
.cp{padding:0 var(--s5) var(--s6);}

/* Field grid */
.fgrid{
  display:grid;gap:var(--s4) var(--s5);
  grid-template-columns:1fr;
}
@media(min-width:500px){.fgrid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1024px){.fgrid{grid-template-columns:repeat(4,1fr);}}
.sp2{grid-column:span 2;}
@media(min-width:1024px){.sp3{grid-column:span 3;}}
@media(max-width:499px){.sp2,.sp3{grid-column:span 1;}}

/* Field */
.flbl{
  display:flex;align-items:center;gap:3px;
  font-size:.75rem;font-weight:600;letter-spacing:.005em;
  color:var(--tx2);margin-bottom:var(--s2);overflow:visible;
}
.finp{
  width:100%;height:2.625rem;padding:0 var(--s4);
  border-radius:var(--r-m);
  border:1.5px solid var(--b1);
  background:var(--s1a);color:var(--tx1);
  font-size:.9375rem;font-family:inherit;
  appearance:none;-webkit-appearance:none;outline:none;
  box-shadow:var(--sh0);
  transition:border-color var(--t1),box-shadow var(--t1),background var(--t3) var(--smooth);
}
html.dark .finp{background:var(--s2a);border-color:var(--b1);color:var(--tx1);}
.finp::placeholder{color:var(--tx4);font-style:italic;font-size:.875rem;}
.finp:hover{border-color:var(--b2);}
.finp:focus{
  border-color:var(--color-brand-500);
  background:var(--s0);
  box-shadow:0 0 0 3px color-mix(in oklab,var(--color-brand-500) 16%,transparent),var(--sh0);
}
html.dark .finp:focus{background:var(--s1a);}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.selw{position:relative;}
.selw::after{
  content:'';position:absolute;right:var(--s4);top:50%;
  transform:translateY(-50%);
  width:.5rem;height:.5rem;
  background:var(--tx3);
  clip-path:polygon(100% 20%,0 20%,50% 82%);
  pointer-events:none;transition:background var(--t1);
}
.selw:focus-within::after{background:var(--color-brand-500);}

/* ═══════════════════════════════════════════════════════════════
   RESULT SECTIONS
═══════════════════════════════════════════════════════════════ */
.rstack{display:flex;flex-direction:column;gap:var(--s3);}

.rsec{
  background:var(--s0);
  border:1px solid var(--b0);border-radius:var(--r-xl);
  overflow:hidden;box-shadow:var(--sh0);
  transition:background var(--t3) var(--smooth),border-color var(--t3) var(--smooth),
    box-shadow var(--t2) var(--smooth),transform var(--t2) var(--spring);
}
html.dark .rsec{background:var(--s1a);border-color:var(--b1);}
.rsec:hover{
  border-color:color-mix(in oklab,var(--color-brand-400) 35%,transparent);
  box-shadow:var(--sh1);
}
html.dark .rsec:hover{
  border-color:color-mix(in oklab,var(--color-brand-600) 40%,transparent);
}

/* Card grid */
.cgrid{display:grid;gap:var(--s3);grid-template-columns:1fr;}
@media(min-width:500px){.cgrid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1024px){.cgrid{grid-template-columns:repeat(3,1fr);}}
@media(min-width:1280px){.cgrid.w{grid-template-columns:repeat(4,1fr);}}

/* ═══════════════════════════════════════════════════════════════
   CARDS
═══════════════════════════════════════════════════════════════ */
.card{
  position:relative;
  background:var(--s0);
  border:1px solid var(--b0);
  border-radius:var(--r-l);
  padding:var(--s4);
  min-height:9rem;
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:var(--sh0);
  transition:
    transform var(--t2) var(--spring),
    box-shadow var(--t2) var(--smooth),
    border-color var(--t1) var(--smooth),
    background var(--t3) var(--smooth);
  will-change:transform;
}
html.dark .card{background:var(--s0);border-color:var(--b1);}

/* Hover lift */
.card:hover{
  transform:translateY(-3px);
  box-shadow:var(--sh2);
  border-color:color-mix(in oklab,var(--color-brand-400) 45%,transparent);
}
html.dark .card:hover{
  border-color:color-mix(in oklab,var(--color-brand-500) 40%,transparent);
  box-shadow:var(--sh2);
}

/* Accent shimmer on hover — brand gradient left stripe */
.card::before{
  content:'';position:absolute;left:0;top:var(--s3);bottom:var(--s3);
  width:3px;border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,var(--color-brand-400),var(--color-brand-600));
  opacity:0;transform:scaleY(.6);
  transition:opacity var(--t2) var(--smooth),transform var(--t2) var(--spring);
}
.card:hover::before{opacity:1;transform:scaleY(1);}

/* Card — top highlight line on hover */
.card::after{
  content:'';position:absolute;left:0;right:0;top:0;
  height:1px;border-radius:var(--r-l) var(--r-l) 0 0;
  background:linear-gradient(90deg,
    color-mix(in oklab,var(--color-brand-400) 0%,transparent),
    color-mix(in oklab,var(--color-brand-400) 60%,transparent),
    color-mix(in oklab,var(--color-brand-400) 0%,transparent));
  opacity:0;
  transition:opacity var(--t2) var(--smooth);
}
.card:hover::after{opacity:1;}

/* Card waiting */
.card-w{
  border-style:dashed;border-color:var(--b1);
  background:var(--s1a);box-shadow:none;opacity:.55;
}
html.dark .card-w{background:rgba(255,255,255,.02);border-color:var(--b1);}
.card-w:hover{transform:none;box-shadow:none;opacity:.8;border-color:var(--b2);}
.card-w::before,.card-w::after{display:none;}

/* Card error */
.card-e{
  border-color:rgba(239,68,68,.2);background:rgba(254,242,242,.5);
  box-shadow:none;
}
html.dark .card-e{background:rgba(127,29,29,.1);border-color:rgba(239,68,68,.18);}
.card-e:hover{transform:none;box-shadow:var(--sh0);}

/* Card typography */
.clbl{
  font-size:.5625rem;font-weight:800;letter-spacing:.09em;
  text-transform:uppercase;
  color:var(--color-brand-500);
  display:flex;align-items:center;gap:3px;
  margin-bottom:var(--s2);line-height:1;overflow:visible;
  transition:color var(--t1);
}
html.dark .clbl{color:var(--color-brand-400);}
.card:hover .clbl{color:var(--color-brand-600);}
html.dark .card:hover .clbl{color:var(--color-brand-300);}

.cval{display:flex;align-items:baseline;gap:4px;margin-bottom:var(--s3);}
.cnum{
  font-size:2rem;font-weight:900;letter-spacing:-.035em;line-height:1;
  color:var(--tx1);font-variant-numeric:tabular-nums;
}
.cunit{font-size:.75rem;font-weight:600;color:var(--tx3);letter-spacing:.01em;}

.cbadge{
  display:inline-flex;align-items:center;
  padding:2px 7px;border-radius:var(--r-s);
  font-size:.5625rem;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:var(--s2);
  background:color-mix(in oklab,currentColor 10%,transparent);
  border:1px solid color-mix(in oklab,currentColor 22%,transparent);
}

.cdesc{font-size:.6875rem;line-height:1.55;color:var(--tx3);font-weight:400;}

/* Wait tag */
.wtag{
  display:inline-flex;align-items:center;gap:var(--s1);
  padding:3px var(--s3);border-radius:var(--r-s);
  font-size:.6875rem;font-weight:500;
  background:var(--s1a);color:var(--tx2);
  border:1px solid var(--b1);box-shadow:var(--sh0);
}
html.dark .wtag{background:rgba(255,255,255,.04);}

/* Wait dot — pulsing */
.wdot{
  width:5px;height:5px;border-radius:50%;flex-shrink:0;
  background:var(--color-brand-400);
  animation:pulse 2s var(--smooth) infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(.65);}}

/* ═══════════════════════════════════════════════════════════════
   TOOLTIP
═══════════════════════════════════════════════════════════════ */
.tico{
  box-sizing:border-box;
  min-width:44px;min-height:44px;
  padding:14px 20px;margin:-14px -20px -14px 0;
  display:inline-flex;align-items:center;justify-content:center;
  background:none;border:none;
  cursor:help;color:var(--tx3);flex-shrink:0;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
  transition:color var(--t1),transform var(--t1) var(--spring);
}
.tico:hover,.tico:focus-visible,.tico:active{
  color:var(--color-brand-500);transform:scale(1.2);outline:none;
}
html.dark .tico:hover,html.dark .tico:focus-visible{color:var(--color-brand-400);}

#__tt{
  position:fixed;z-index:9999;display:none;pointer-events:none;
  width:max-content;max-width:220px;
  padding:8px 12px;border-radius:var(--r-m);
  font-size:.6875rem;font-weight:500;line-height:1.6;letter-spacing:.01em;
  text-align:left;white-space:normal;
  background:var(--s0);color:var(--tx1);
  border:1px solid var(--b2);
  border-left:3px solid var(--color-brand-500);
  box-shadow:var(--sh3);
  opacity:0;transform:translateY(6px) scale(.94);
  transform-origin:bottom center;
  transition:opacity 130ms var(--out),transform 150ms var(--spring);
}
html.dark #__tt{background:#232326;color:var(--tx1);border-color:var(--b2);}
#__tt::after{
  content:'';position:absolute;left:50%;margin-left:-5px;
  border:5px solid transparent;
}
#__tt:not([data-arrow="down"])::after{top:100%;border-top-color:var(--s0);}
html.dark #__tt:not([data-arrow="down"])::after{border-top-color:#232326;}
#__tt[data-arrow="down"]::after{bottom:100%;top:auto;border-bottom-color:var(--s0);}
html.dark #__tt[data-arrow="down"]::after{border-bottom-color:#232326;}
#__tt.tin{opacity:1;transform:translateY(0) scale(1);}
@media(max-width:640px){#__tt{max-width:185px;}}

/* ═══════════════════════════════════════════════════════════════
   ANIMATIONS
═══════════════════════════════════════════════════════════════ */

/* Header */
@keyframes hdrIn{
  from{opacity:0;transform:translateY(-14px);}
  to{opacity:1;transform:translateY(0);}
}
.hdr{animation:hdrIn .4s var(--out) both;}

/* Page */
@keyframes pgIn{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}
.page{animation:pgIn .5s .06s var(--out) both;}

/* Input panel */
.inp-panel{
  animation:pgIn .4s .12s var(--out) both;
}

/* Result sections — staggered */
.rsec:nth-child(1){animation:pgIn .38s .16s var(--out) both;}
.rsec:nth-child(2){animation:pgIn .38s .22s var(--out) both;}
.rsec:nth-child(3){animation:pgIn .38s .28s var(--out) both;}
.rsec:nth-child(4){animation:pgIn .38s .34s var(--out) both;}
.rsec:nth-child(5){animation:pgIn .38s .40s var(--out) both;}

/* Cards — staggered entrance */
@keyframes cardIn{
  from{opacity:0;transform:translateY(10px) scale(.97);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.card{animation:cardIn .28s var(--spring) both;}
.card:nth-child(1){animation-delay:.00s;}
.card:nth-child(2){animation-delay:.05s;}
.card:nth-child(3){animation-delay:.10s;}
.card:nth-child(4){animation-delay:.15s;}
.card:nth-child(5){animation-delay:.02s;}
.card:nth-child(6){animation-delay:.07s;}
.card:nth-child(7){animation-delay:.12s;}
.card:nth-child(8){animation-delay:.17s;}

/* Theme dot pop on click */
@keyframes dotPop{
  0%{transform:scale(1);}40%{transform:scale(1.35);}100%{transform:scale(1);}
}
.tdot.pop{animation:dotPop .3s var(--spring);}

/* Dark mode toggle spin */
@keyframes sunSpin{from{transform:rotate(-90deg) scale(.5);opacity:0;}to{transform:rotate(0deg) scale(1);opacity:1;}}
@keyframes moonSlide{from{transform:translateX(8px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.ico-spin{animation:sunSpin .3s var(--spring);}
.ico-slide{animation:moonSlide .25s var(--out);}

/* Collapsible smooth open/close */
.coll{
  transition:grid-template-rows var(--t2) var(--smooth);
}

/* Focus ring — all interactive */
:focus-visible{
  outline:2px solid var(--color-brand-500);outline-offset:2px;border-radius:var(--r-s);
}

/* Input micro-interaction */
.finp{transition:border-color var(--t1),box-shadow var(--t1),background var(--t3) var(--smooth),transform var(--t1) var(--spring);}
.finp:focus{transform:scale(1.005);}

/* Reduced motion */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<!-- ══ HEADER ══════════════════════════════════════════════════ -->
<header class="hdr">
  <div class="hdr-in">

    <div class="logo-area">
      <div class="logo-ico">
        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2
               M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
        </svg>
      </div>
      <div>
        <div class="logo-name">BioMetrics Pro</div>
        <div class="logo-sub">Kalkulator Komposisi Tubuh</div>
      </div>
    </div>

    <!-- Mobile theme dots -->
    <div class="m-dots" id="dots-m"></div>

    <!-- Control pill -->
    <div class="ctrl">
      <div class="d-dots" id="dots-d"></div>
      <div class="psep" id="dsep" style="display:none;"></div>

      <div class="urow">
        <span class="ulbl on" id="lbl-m">Metrik</span>
        <div class="sw" id="sw" role="switch" aria-checked="false" tabindex="0"
             onclick="toggleUnit()"
             onkeydown="if(event.key==='Enter'||event.key===' ')toggleUnit()">
          <div class="swk"></div>
        </div>
        <span class="ulbl" id="lbl-i">Imperial</span>
      </div>

      <div class="psep"></div>

      <button class="dbtn" id="btn-dark" aria-label="Ganti mode gelap/terang">
        <svg id="ico-sun"  style="display:none;" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707
               M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707
               M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <svg id="ico-moon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21
               a9.003 9.003 0 008.354-5.646z"/>
        </svg>
      </button>
    </div>

  </div>
</header>

<!-- ══ MAIN ════════════════════════════════════════════════════ -->
<main class="page">

  <!-- Input panel -->
  <div class="inp-panel">
    <button class="trig" onclick="toggleSec('inp','ch-inp')">
      <span class="trig-lbl">
        <span class="trig-bar"></span>Data Fisik Anda
      </span>
      <svg class="chev open" id="ch-inp" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>
    <div class="coll" id="inp">
      <div><div class="cp">
        <div class="fgrid">

          <div>
            <label class="flbl">Jenis Kelamin
              <button class="tico" type="button" data-tip="Pilih jenis kelamin biologis — formula medis bergantung pada perbedaan hormon dan komposisi tubuh." aria-label="Info">
                <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </button>
            </label>
            <div class="selw">
              <select id="gender" class="finp">
                <option value="male">Pria</option>
                <option value="female">Wanita</option>
              </select>
            </div>
          </div>

          <div>
            <label class="flbl">Usia (tahun)</label>
            <input type="number" id="age" placeholder="25" min="1" max="120" class="finp">
          </div>

          <div>
            <label class="flbl">Tinggi (<span class="unit-len">cm</span>)</label>
            <input type="number" id="height" placeholder="170" class="finp">
          </div>

          <div>
            <label class="flbl">Berat (<span class="unit-weight">kg</span>)</label>
            <input type="number" id="weight" placeholder="70" class="finp">
          </div>

          <div>
            <label class="flbl">Lingkar Pinggang (<span class="unit-len">cm</span>)
              <button class="tico" type="button" data-tip="Diukur mendatar melingkar tepat di pusar, bukan di pinggang terkecil." aria-label="Info">
                <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </button>
            </label>
            <input type="number" id="waist" placeholder="82" class="finp">
          </div>

          <div>
            <label class="flbl">Lingkar Leher (<span class="unit-len">cm</span>)
              <button class="tico" type="button" data-tip="Diukur melingkar di bawah jakun. Pastikan pita ukur rata dan tidak miring." aria-label="Info">
                <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </button>
            </label>
            <input type="number" id="neck" placeholder="37" class="finp">
          </div>

          <div>
            <label class="flbl">Lingkar Pinggul (<span class="unit-len">cm</span>)
              <button class="tico" type="button" data-tip="Diukur di bagian pantat terlebar, sekitar 20 cm di bawah pusar." aria-label="Info">
                <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </button>
            </label>
            <input type="number" id="hip" placeholder="95" class="finp">
          </div>

          <div>
            <label class="flbl">Lingkar Pergelangan (<span class="unit-len">cm</span>)
              <button class="tico" type="button" data-tip="Diukur tepat di atas tonjolan tulang pergelangan tangan." aria-label="Info">
                <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </button>
            </label>
            <input type="number" id="wrist" placeholder="17" class="finp">
          </div>

          <div>
            <label class="flbl">Denyut Nadi Istirahat (bpm)
              <button class="tico" type="button" data-tip="Ukur saat baru bangun tidur sebelum bergerak. Hitung detak selama 60 detik penuh." aria-label="Info">
                <svg width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              </button>
            </label>
            <input type="number" id="rhr" placeholder="65" min="30" max="200" class="finp">
          </div>

          <div class="sp2 sp3">
            <label class="flbl">Level Aktivitas Fisik</label>
            <div class="selw">
              <select id="activity" class="finp">
                <option value="1.2">Sangat jarang — Duduk seharian</option>
                <option value="1.375">Ringan — Olahraga santai 1–3× seminggu</option>
                <option value="1.55">Sedang — Olahraga menengah 3–5× seminggu</option>
                <option value="1.725">Aktif — Olahraga intens 6–7× seminggu</option>
                <option value="1.9">Ekstrem — Pekerjaan fisik berat / atlet</option>
              </select>
            </div>
          </div>

        </div>
      </div></div>
    </div>
  </div>

  <!-- Result sections -->
  <div class="rstack">

    <div class="rsec">
      <button class="trig" onclick="toggleSec('ru','ch-ru')">
        <span class="trig-lbl"><span class="trig-bar"></span>Status Fisik Umum</span>
        <svg class="chev open" id="ch-ru" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div class="coll" id="ru"><div><div class="cp">
        <div class="cgrid w" id="cat-umum"></div>
      </div></div></div>
    </div>

    <div class="rsec">
      <button class="trig" onclick="toggleSec('rk','ch-rk')">
        <span class="trig-lbl"><span class="trig-bar"></span>Komposisi Lemak &amp; Otot</span>
        <svg class="chev open" id="ch-rk" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div class="coll" id="rk"><div><div class="cp">
        <div class="cgrid w" id="cat-komposisi"></div>
      </div></div></div>
    </div>

    <div class="rsec">
      <button class="trig" onclick="toggleSec('rkd','ch-rkd')">
        <span class="trig-lbl"><span class="trig-bar"></span>Kebugaran Kardiovaskular</span>
        <svg class="chev open" id="ch-rkd" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div class="coll" id="rkd"><div><div class="cp">
        <div class="cgrid w" id="cat-kardio"></div>
      </div></div></div>
    </div>

    <div class="rsec">
      <button class="trig" onclick="toggleSec('rm','ch-rm')">
        <span class="trig-lbl"><span class="trig-bar"></span>Metabolisme Energi</span>
        <svg class="chev open" id="ch-rm" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div class="coll" id="rm"><div><div class="cp">
        <div class="cgrid" id="cat-metabolisme"></div>
      </div></div></div>
    </div>

    <div class="rsec">
      <button class="trig" onclick="toggleSec('rr','ch-rr')">
        <span class="trig-lbl"><span class="trig-bar"></span>Prediksi Kardiometabolik</span>
        <svg class="chev open" id="ch-rr" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div class="coll" id="rr"><div><div class="cp">
        <div class="cgrid" id="cat-risiko"></div>
      </div></div></div>
    </div>

  </div>
</main>

<script>
/* ═══════════════════════════════════════════════════════════════
   PALETTES
═══════════════════════════════════════════════════════════════ */
const PAL={
  ocean:    {50:'#f0f9ff',100:'#e0f2fe',200:'#bae6fd',300:'#7dd3fc',400:'#38bdf8',500:'#0ea5e9',600:'#0284c7',700:'#0369a1',800:'#075985',900:'#0c4a6e',950:'#082f49'},
  mint:     {50:'#ecfdf5',100:'#d1fae5',200:'#a7f3d0',300:'#6ee7b7',400:'#34d399',500:'#10b981',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b',950:'#022c22'},
  sakura:   {50:'#fdf2f8',100:'#fce7f3',200:'#fbcfe8',300:'#f9a8d4',400:'#f472b6',500:'#ec4899',600:'#db2777',700:'#be185d',800:'#9d174d',900:'#831843',950:'#500724'},
  lavender: {50:'#faf5ff',100:'#f3e8ff',200:'#e9d5ff',300:'#d8b4fe',400:'#c084fc',500:'#a855f7',600:'#9333ea',700:'#7e22ce',800:'#6b21a8',900:'#581c87',950:'#3b0764'},
};

let curTheme='ocean';
function applyTheme(name){
  const p=PAL[name];if(!p)return;
  const r=document.documentElement;
  for(const[k,v]of Object.entries(p))r.style.setProperty(`--color-brand-${k}`,v);
  curTheme=name;
  document.querySelectorAll('.tdot').forEach(d=>d.classList.toggle('active',d.dataset.theme===name));
}
function setTheme(name){
  applyTheme(name);try{localStorage.setItem('bm-theme',name);}catch(e){}
  // pop animation on active dot
  document.querySelectorAll('.tdot.active').forEach(d=>{
    d.classList.remove('pop');
    requestAnimationFrame(()=>{requestAnimationFrame(()=>d.classList.add('pop'));});
    d.addEventListener('animationend',()=>d.classList.remove('pop'),{once:true});
  });
}

/* ── Pickers ──────────────────────────────────────────────── */
const TDEFS=[
  {id:'ocean',   h1:'#7dd3fc',h2:'#0369a1',label:'Ocean'},
  {id:'mint',    h1:'#6ee7b7',h2:'#059669',label:'Mint'},
  {id:'sakura',  h1:'#f9a8d4',h2:'#db2777',label:'Sakura'},
  {id:'lavender',h1:'#d8b4fe',h2:'#9333ea',label:'Lavender'},
];
function mkDots(id){
  document.getElementById(id).innerHTML=TDEFS.map(t=>
    `<button class="tdot" data-theme="${t.id}" onclick="setTheme('${t.id}')" title="${t.label}">
      <div style="width:50%;background:${t.h1};height:100%;"></div>
      <div style="width:50%;background:${t.h2};height:100%;"></div>
    </button>`).join('');
}
mkDots('dots-m');mkDots('dots-d');
const mq=window.matchMedia('(min-width:640px)');
const syncDots=()=>{
  const s=mq.matches;
  document.getElementById('dots-d').style.display=s?'flex':'none';
  document.getElementById('dsep').style.display=s?'block':'none';
};
mq.addEventListener('change',syncDots);syncDots();
(function(){var t;try{t=localStorage.getItem('bm-theme');}catch(e){}applyTheme(t||'ocean');})();

/* ── Dark mode ──────────────────────────────────────────────── */
const root=document.documentElement;
const sunIco=document.getElementById('ico-sun');
const moonIco=document.getElementById('ico-moon');

function applyDark(dark){
  root.classList.toggle('dark',dark);
  sunIco.style.display=dark?'block':'none';
  moonIco.style.display=dark?'none':'block';
}
const sd=(function(){try{return localStorage.getItem('bm-dark');}catch(e){return null;}})();
applyDark(sd==='true'||(!sd&&window.matchMedia('(prefers-color-scheme:dark)').matches));

document.getElementById('btn-dark').addEventListener('click',()=>{
  const d=root.classList.toggle('dark');
  try{localStorage.setItem('bm-dark',d);}catch(e){}
  applyDark(d);
  // icon animation
  const ico=d?sunIco:moonIco;
  ico.classList.remove(d?'ico-slide':'ico-spin');
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>ico.classList.add(d?'ico-spin':'ico-slide'));
  });
  ico.addEventListener('animationend',()=>ico.classList.remove('ico-spin','ico-slide'),{once:true});
});

/* ── Collapsible ─────────────────────────────────────────── */
function toggleSec(id,chId){
  const sec=document.getElementById(id);
  const ch=document.getElementById(chId);
  sec.classList.toggle('shut');
  ch.classList.toggle('open',!sec.classList.contains('shut'));
}

/* ── Unit toggle ─────────────────────────────────────────── */
let curUnit='metric';
const CM2IN=1/2.54,KG2LB=2.20462;
const lenIds=['height','waist','neck','hip','wrist'];

function toggleUnit(){
  const toImp=curUnit==='metric';
  curUnit=toImp?'imperial':'metric';
  lenIds.forEach(id=>{
    const el=document.getElementById(id),v=parseFloat(el.value);
    if(!isNaN(v))el.value=(toImp?v*CM2IN:v/CM2IN).toFixed(1);
  });
  const we=document.getElementById('weight'),wv=parseFloat(we.value);
  if(!isNaN(wv))we.value=(toImp?wv*KG2LB:wv/KG2LB).toFixed(1);
  const m=curUnit==='metric';
  const sw=document.getElementById('sw');
  sw.classList.toggle('on',!m);
  sw.setAttribute('aria-checked',(!m).toString());
  document.getElementById('lbl-m').classList.toggle('on',m);
  document.getElementById('lbl-i').classList.toggle('on',!m);
  document.querySelectorAll('.unit-len').forEach(e=>e.textContent=m?'cm':'in');
  document.querySelectorAll('.unit-weight').forEach(e=>e.textContent=m?'kg':'lbs');
  calc();
}

/* ── Card builders ───────────────────────────────────────── */
const DEP={
  age:'Usia',height:'Tinggi',weight:'Berat',
  waist:'Lingkar Pinggang',neck:'Lingkar Leher',
  hip:'Lingkar Pinggul',wrist:'Lingkar Pergelangan',rhr:'Denyut Nadi',
};

function tipHTML(txt){
  return `<button class="tico" type="button" data-tip="${txt.replace(/"/g,'&quot;')}" aria-label="Info">
    <svg width="11" height="11" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
  </button>`;
}

function buildCard(title,deps,data,fn,tip){
  const miss=deps.filter(k=>isNaN(data[k])||data[k]<=0);
  const icon=tipHTML(tip);
  if(miss.length)return`
    <div class="card card-w">
      <p class="clbl">${title} ${icon}</p>
      <div class="wtag"><span class="wdot"></span>Menunggu: ${miss.map(m=>DEP[m]).join(', ')}</div>
    </div>`;
  try{
    const r=fn(data);if(r.error)throw new Error(r.error);
    return`
    <div class="card">
      <div>
        <p class="clbl">${title} ${icon}</p>
        <div class="cval"><span class="cnum">${r.nilai}</span><span class="cunit">${r.satuan}</span></div>
      </div>
      <div>
        ${r.status?`<div class="cbadge ${r.warna}">${r.status}</div>`:''}
        <p class="cdesc">${r.deskripsi}</p>
      </div>
    </div>`;
  }catch(e){
    return`
    <div class="card card-e">
      <p class="clbl c-danger">${title} ${icon}</p>
      <p class="cdesc c-danger" style="margin-top:var(--s2);">${e.message}</p>
    </div>`;
  }
}

function fmtW(v){return curUnit==='metric'?{v,u:'kg'}:{v:v*KG2LB,u:'lbs'};}
function fmtV(v){return curUnit==='metric'?{v,u:'L'}:{v:v*33.814,u:'fl oz'};}
function calcBmr(d){const b=10*d.weight+6.25*d.height-5*d.age;return d.gender==='male'?b+5:b-161;}
function calcNavy(d){
  if(d.waist<=d.neck)throw new Error('Pinggang tidak boleh lebih kecil dari leher.');
  const f=d.gender==='male'
    ?495/(1.0324-0.19077*Math.log10(d.waist-d.neck)+0.15456*Math.log10(d.height))-450
    :495/(1.29579-0.35004*Math.log10(d.waist+d.hip-d.neck)+0.22100*Math.log10(d.height))-450;
  if(isNaN(f)||f<2||f>60)throw new Error('Hasil anomali — periksa kembali pengukuran.');
  return f;
}

function calc() {
        const raw = {
            gender:   document.getElementById('gender').value,
            age:      parseFloat(document.getElementById('age').value),
            height:   parseFloat(document.getElementById('height').value),
            weight:   parseFloat(document.getElementById('weight').value),
            waist:    parseFloat(document.getElementById('waist').value),
            neck:     parseFloat(document.getElementById('neck').value),
            hip:      parseFloat(document.getElementById('hip').value),
            wrist:    parseFloat(document.getElementById('wrist').value),
            rhr:      parseFloat(document.getElementById('rhr').value),
            activity: parseFloat(document.getElementById('activity').value),
        };
        const d = {...raw};
        if (curUnit==='imperial') {
            lenIds.forEach(k => { if(!isNaN(d[k])) d[k] = d[k]*2.54; });
            if (!isNaN(d.weight)) d.weight = d.weight/KG2LB;
        }
        const hM = d.height/100;
        const cats = {umum:[],komposisi:[],kardio:[],metabolisme:[],risiko:[]};
        const K = (c,t,deps,fn,tip) => cats[c].push(buildCard(t,deps,d,fn,tip));

        // ── UMUM ──
        K('umum','Indeks Massa Tubuh',['height','weight'],()=>{
            const bmi=d.weight/(hM**2);
            let s='Normal',w='c-good';
            if(bmi<18.5){s='Kekurangan Berat';w='c-info';}
            else if(bmi>=25&&bmi<30){s='Kelebihan Berat';w='c-warn';}
            else if(bmi>=30){s='Obesitas';w='c-danger';}
            return {nilai:bmi.toFixed(1),satuan:'kg/m²',status:s,warna:w,deskripsi:'Indikator standar WHO proporsi berat terhadap tinggi.'};
        },'Indeks Massa Tubuh (Body Mass Index).');

        K('umum','Indeks Ponderal',['height','weight'],()=>{
            const pi=d.weight/(hM**3);
            let s='Volume Normal',w='c-good';
            if(pi<11){s='Volume Kurang';w='c-info';}else if(pi>15){s='Volume Berlebih';w='c-danger';}
            return {nilai:pi.toFixed(1),satuan:'kg/m³',status:s,warna:w,deskripsi:'Rasio ketebalan tubuh berdasar volume 3D.'};
        },'Alternatif BMI lebih akurat untuk individu sangat tinggi/pendek.');

        K('umum','Rentang Sehat',['height'],()=>{
            const lo=fmtW(18.5*(hM**2)), hi=fmtW(24.9*(hM**2));
            return {nilai:`${lo.v.toFixed(1)} – ${hi.v.toFixed(1)}`,satuan:lo.u,status:'',warna:'',deskripsi:'Batas agar skor IMT Anda eksklusif di zona normal.'};
        },'Rentang berat minimum dan maksimum agar IMT tetap sehat.');

        K('umum','Berat Ideal',['height'],()=>{
            const hIn=d.height/2.54;
            const bKg=d.gender==='male'?50+2.3*(hIn-60):45.5+2.3*(hIn-60);
            const o=fmtW(bKg);
            return {nilai:o.v.toFixed(1),satuan:o.u,status:'',warna:'',deskripsi:'Formula Devine (standar klinis). Akurasi optimal untuk tinggi 152–190 cm.'};
        },'Target berat badan paling optimal yang direkomendasikan secara klinis.');

        K('umum','Ukuran Kerangka',['height','wrist'],()=>{
            const r=d.height/d.wrist;
            let u='Sedang';
            if(d.gender==='male'){if(r>10.4)u='Kecil';else if(r<9.6)u='Besar';}
            else{if(r>11.0)u='Kecil';else if(r<10.1)u='Besar';}
            return {nilai:u,satuan:'',status:'',warna:'',deskripsi:'Mempengaruhi batas maksimum otot natural Anda.'};
        },'Analisis kerangka tulang berdasarkan rasio tinggi dan lingkar pergelangan tangan.');

        // ── KOMPOSISI ──
        const nDeps=d.gender==='male'?['height','waist','neck']:['height','waist','neck','hip'];
        K('komposisi','Lemak Tubuh (US Navy)',nDeps,()=>{
            const f=calcNavy(d);
            return {nilai:f.toFixed(1),satuan:'%',status:'',warna:'',deskripsi:'Estimasi persentase lemak standar US Navy.'};
        },'Tingkat akurasi tinggi menggunakan metode antropometri angkatan laut.');

        K('komposisi','Adipositas (BAI)',['height','hip'],()=>{
            const b=((d.hip/Math.pow(hM,1.5))-18).toFixed(1);
            return {nilai:b,satuan:'%',status:'',warna:'',deskripsi:'Massa lemak berdasar distribusi panggul.'};
        },'Body Adiposity Index: Estimasi lemak yang tak terpengaruh berat timbangan.');

        K('komposisi','Lemak Relatif (RFM)',['height','waist'],()=>{
            const rfm=d.gender==='male'?64-(20*(d.height/d.waist)):76-(20*(d.height/d.waist));
            return {nilai:rfm.toFixed(1),satuan:'%',status:'',warna:'',deskripsi:'Prediktor komposisi lemak alternatif IMT.'};
        },'Metode estimasi jaringan lemak yang dianggap jauh lebih akurat daripada IMT.');

        K('komposisi','Massa Tanpa Lemak',['weight',...nDeps],()=>{
            const f=calcNavy(d), lbm=d.weight*(1-f/100), o=fmtW(lbm);
            return {nilai:o.v.toFixed(1),satuan:o.u,status:'',warna:'',deskripsi:'Berat otot, organ, air, dan tulang (bersih).'};
        },'Berat Anda jika seluruh sel lemak dihilangkan.');

        K('komposisi','Indeks Bebas Lemak',['weight',...nDeps],()=>{
            const f=calcNavy(d), lbm=d.weight*(1-f/100), ffmi=lbm/(hM**2);
            let s='Kepadatan Otot Normal',w='c-brand';
            if(d.gender==='male'){if(ffmi>=22){s='Superior / Atletis';w='c-good';}else if(ffmi<18)s='Sub-Standar';}
            else{if(ffmi>=18){s='Superior / Atletis';w='c-good';}else if(ffmi<15)s='Sub-Standar';}
            return {nilai:ffmi.toFixed(1),satuan:'skala',status:s,warna:w,deskripsi:'Parameter absolut batas kepadatan otot natural.'};
        },'Fat-Free Mass Index: Standar untuk mengukur ketebalan perkembangan serabut otot rangka.');

        // ── KARDIO ──
        K('kardio','Estimasi VO2 Max',['age','rhr'],()=>{
            const maxHr=208-0.7*d.age, vo2=15.3*(maxHr/d.rhr);
            let s='Standar',w='c-brand';
            if(vo2>=45){s='Eksepsional';w='c-info';}else if(vo2<30){s='Lemah';w='c-danger';}
            return {nilai:vo2.toFixed(1),satuan:'ml/kg/min',status:s,warna:w,deskripsi:'Efisiensi suplai O₂ & sirkulasi jantung.'};
        },'Kapasitas maksimum suplai oksigen yang diproses jantung Anda per menit.');

        K('kardio','Batas Max HR',['age'],()=>{
            return {nilai:Math.round(208-0.7*d.age),satuan:'bpm',status:'',warna:'',deskripsi:'Ambang batas keselamatan kontraksi ventrikel.'};
        },'Batas rasional tertinggi detak jantung aman saat berolahraga intens.');

        K('kardio','Zona Pembakaran Lemak',['age','rhr'],()=>{
            const mx=Math.round(208-0.7*d.age), res=mx-d.rhr;
            const lo=Math.round(res*0.6+d.rhr), hi=Math.round(res*0.7+d.rhr);
            return {nilai:`${lo}–${hi}`,satuan:'bpm',status:'',warna:'',deskripsi:'Rentang detak optimal membakar adiposa.'};
        },'Rentang ritme detak jantung saat kardio agar prioritas tubuh adalah memecah lemak.');

        K('kardio','Kebutuhan Hidrasi',['weight'],()=>{
            let v=(d.weight*35)/1000; if(d.activity>=1.55)v+=0.5;
            const o=fmtV(v);
            return {nilai:o.v.toFixed(1),satuan:o.u,status:'',warna:'',deskripsi:'Target minimal cairan untuk mengganti keringat.'};
        },'Target pemenuhan cairan harian Anda.');

        // ── METABOLISME ──
        K('metabolisme','Total Kalori (TDEE)',['weight','height','age'],()=>{
            return {nilai:Math.round(calcBmr(d)*d.activity),satuan:'kcal',status:'',warna:'',deskripsi:'Akumulasi kalori terbakar dalam 24 jam.'};
        },'Total Daily Energy Expenditure: Kalori yang Anda bakar seharian berdasarkan rutinitas.');

        K('metabolisme','Target Protein',['weight','height','age'],()=>{
            return {nilai:Math.round((calcBmr(d)*d.activity*0.3)/4),satuan:'g',status:'',warna:'',deskripsi:'30% dari total kalori harian.'};
        },'Kebutuhan minimum asam amino untuk mempertahankan massa otot.');

        K('metabolisme','Karbo & Lemak',['weight','height','age'],()=>{
            const tdee=calcBmr(d)*d.activity;
            return {nilai:`${Math.round((tdee*0.5)/4)} / ${Math.round((tdee*0.2)/9)}`,satuan:'g',status:'',warna:'',deskripsi:'50% Karbohidrat dan 20% Lemak.'};
        },'Alokasi sisa ruang kalori harian untuk sumber energi utama dan pelarut vitamin.');

        // ── RISIKO ──
        K('risiko','ABSI (Mortalitas)',['waist','height','weight'],()=>{
            const bmi=d.weight/(hM**2), absi=(d.waist/100)/(Math.pow(bmi,2/3)*Math.sqrt(hM));
            return {nilai:absi.toFixed(4),satuan:'indeks',status:'',warna:'',deskripsi:'A Body Shape Index: Risiko kematian dini.'};
        },'Prediktor spesifik ancaman penyakit akibat lipatan lemak viseral.');

        K('risiko','Rasio Pinggang/Tinggi',['waist','height'],()=>{
            const r=d.waist/d.height, safe=r<=0.5;
            return {nilai:r.toFixed(2),satuan:'rasio',status:safe?'Jantung Aman':'Rentan Jantung',warna:safe?'c-good':'c-danger',deskripsi:'Batas ideal: Pinggang di bawah separuh tinggi.'};
        },'Indikator tajam prediksi penyakit kardiovaskular. Target < 0.5.');

        K('risiko','Rasio Pinggang/Pinggul',['waist','hip'],()=>{
            const r=d.waist/d.hip;
            const risky=(d.gender==='male'&&r>=0.90)||(d.gender==='female'&&r>=0.85);
            return {nilai:r.toFixed(2),satuan:'rasio',status:risky?'Risiko Diabetes (Apple)':'Risiko Rendah (Pear)',warna:risky?'c-danger':'c-good',deskripsi:'Mendeteksi kecenderungan penimbunan lemak organ.'};
        },'Bentuk Apel dikaitkan erat dengan paparan sindrom metabolik diabetes.');

        ['umum','komposisi','kardio','metabolisme','risiko'].forEach(c =>
            document.getElementById('cat-'+c).innerHTML = cats[c].join(''));
    }

/* ── Tooltip ─────────────────────────────────────────────── */
function initTooltips(){
  let TT=document.getElementById('__tt');
  if(!TT){
    TT=document.createElement('div');
    TT.id='__tt';
    document.body.appendChild(TT);
  }
  let hideTimer=null,activeIco=null;

  function showTip(ico){
    clearTimeout(hideTimer);
    const txt=ico.dataset.tip;if(!txt)return;
    activeIco=ico;
    TT.textContent=txt;
    TT.style.top='-9999px';TT.style.left='-9999px';TT.style.display='block';
    const ir=ico.getBoundingClientRect();
    const tr=TT.getBoundingClientRect();
    const vw=window.innerWidth,GAP=8;
    let top,arrow;
    if(ir.top-tr.height-GAP>=4){top=ir.top-tr.height-GAP;arrow='up';}
    else{top=ir.bottom+GAP;arrow='down';}
    let left=ir.left+ir.width/2-tr.width/2;
    left=Math.max(GAP,Math.min(left,vw-tr.width-GAP));
    TT.style.top=top+'px';TT.style.left=left+'px';
    TT.dataset.arrow=arrow;
    requestAnimationFrame(()=>TT.classList.add('tin'));
  }

  function hideTip(){
    clearTimeout(hideTimer);
    TT.classList.remove('tin');
    activeIco=null;
    hideTimer=setTimeout(()=>{TT.style.display='none';},160);
  }

  document.addEventListener('mouseover',e=>{
    const ico=e.target.closest('[data-tip]');if(ico)showTip(ico);
  });
  document.addEventListener('mouseout',e=>{
    const ico=e.target.closest('[data-tip]');if(ico)hideTip();
  });
  document.addEventListener('focusin',e=>{
    const ico=e.target.closest('[data-tip]');if(ico)showTip(ico);
  });
  document.addEventListener('focusout',e=>{
    const ico=e.target.closest('[data-tip]');if(ico)hideTip();
  });
  document.addEventListener('click',e=>{
    const ico=e.target.closest('[data-tip]');
    if(ico){e.stopPropagation();activeIco===ico?hideTip():showTip(ico);return;}
    if(activeIco)hideTip();
  });
  document.addEventListener('scroll',hideTip,{passive:true,capture:true});
  window.addEventListener('resize',hideTip,{passive:true});
}

let dbT;
document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('input,select').forEach(el=>
    el.addEventListener('input',()=>{clearTimeout(dbT);dbT=setTimeout(calc,130);})
  );
  calc();
  initTooltips();
});
